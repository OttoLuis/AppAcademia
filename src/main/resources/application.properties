spring.application.name=fitIA

spring.datasource.url=jdbc:postgresql://localhost:5433/fitIA
spring.datasource.username=postgres
spring.datasource.password=suaSenha

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

security.client-id=${CLIENT_ID:myclientid}
security.client-secret=${CLIENT_SECRET:myclientsecret}

security.jwt.private-key-path=${JWT_PRIVATE_KEY_PATH:.secrets/jwt-private.pem}
security.jwt.public-key-path=${JWT_PUBLIC_KEY_PATH:.secrets/jwt-public.pem}

security.jwt.duration=${JWT_DURATION:86400} 

cors.origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}
